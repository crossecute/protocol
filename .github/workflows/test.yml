name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      # Actions pinned by commit: a moved tag would change what runs against this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not recursive: OpenZeppelin's nested submodules serve only its own test suite.
          submodules: true

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      - run: forge --version

      - run: forge build

      - run: forge test -vvv
