name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      # Actions pinned by commit: a moved tag would change what runs against this repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not recursive: OpenZeppelin's nested submodules serve only its own test suite.
          submodules: true

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      - run: forge --version

      - run: forge fmt --check

      - run: forge build

      # Fails if any contract under src/ exceeds EIP-170's 24,576-byte runtime limit, which
      # forge test does not enforce (#29).
      - run: forge build --sizes src

      # Fails if a transceiver and a TransceiverExtension share a selector under different
      # signatures, which would shadow the extension function (#70).
      - run: script/check-selectors.sh

      - run: forge lint -D notes

      - run: forge lint -D notes src
        env:
          FOUNDRY_PROFILE: lint-src

      - run: forge test -vvv

  # Reports coverage of src/ and enforces no minimum. The build is unoptimized, so the two
  # tests that pin CrossProxy's initcode hash and the deployer's address skip here; `forge`
  # above holds those values.
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1

      # shell: bash adds pipefail, so a failing test fails the step despite the tee.
      - shell: bash
        run: |
          forge coverage --report summary --report lcov --no-match-coverage '^(test|script|lib)/' \
            | tee coverage.txt
          # The invariant suites print tables too; the coverage table is the one after "Ran".
          { echo '```'; sed -n '/^Ran [0-9]* test suites/,$p' coverage.txt | sed -n '/^╭/,/^╰/p'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: contracts/evm/lcov.info
