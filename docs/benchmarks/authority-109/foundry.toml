[profile.default]
src = "empty-src"
test = "test"
out = "/tmp/crossecute-authority-109-bench-out"
cache_path = "/tmp/crossecute-authority-109-bench-cache"
solc_version = "0.8.28"
evm_version = "paris"
isolate = false
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
allow_paths = ["../../../.."]
remappings = [
  "src/=../../../contracts/evm/src/",
  "fixtures/=../../../contracts/evm/test/signed/",
  "@crossecute/safe-guard/=../../../contracts/safe-guard/src/",
  "forge-std/=../../../contracts/evm/lib/forge-std/src/"
]
