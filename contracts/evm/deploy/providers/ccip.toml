# CCIP chain selectors, keyed by chain name in ../chains.toml. A chain the provider does not
# reach has no entry. Selectors exceed TOML's signed 64-bit integers, so they are strings.
# Source: https://github.com/smartcontractkit/chain-selectors/blob/main/selectors.yml,
# 2026-10-06.

id_bits = 64

# The OnRamp and OffRamp versions a lane may run, as `typeAndVersion()` reports them after
# "OnRamp " and "OffRamp ". CCIP 1.5 reports "EVM2EVMOnRamp 1.5.0" and 1.6 "OnRamp 1.6.x", so
# a legacy lane never matches. `CcipPreflight` reads this before any CCIP deployment.
versions = ["2.0.0"]

[ids]
ethereum = "5009297550715157269"
base = "15971525489660198786"
arbitrum = "4949039107694359620"
optimism = "3734403246176062136"
zksync = "1562403441176082196"
