[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["."]
# Deploy scripts read the chain and provider configuration under deploy/.
fs_permissions = [{ access = "read", path = "./deploy" }, { access = "read", path = "./test/deploy/config" }]
solc_version = "0.8.28"
# Pinned to paris, NOT shanghai: PUSH0 is absent on zkSync, Tron, and several L2s.
# The whole CREATE2 story depends on identical initcode producing identical addresses
# everywhere, so the target must not vary by chain. Do not raise this per-network.
evm_version = "paris"
# Pinned, not left to defaults: optimizer settings change bytecode, and identical
# bytecode across chains is what the CREATE2 derivation depends on.
optimizer = true
optimizer_runs = 200
# The default embeds an IPFS hash of the SOURCE, comments included, in the trailing
# metadata. That put every derived address one comment edit away from moving, which is
# not a property this protocol can have: CrossProxy's initcode hash is what fixes an
# account's address on every chain, and the registry stores initcode hashes to derive
# transceiver locations. "none" drops the source hash; cbor_metadata = false drops the
# rest of the trailer, leaving initcode that depends on the code and nothing else.
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "src/=src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    # Hand-copied, not submodules: none of the three has a dedicated package repo that
    # isolates just these files. See lib/layerzero-*/contracts/.../*.sol for per-file
    # provenance (source repo, exact commit) and docs/provider-research.md §8.
    "@layerzerolabs/oapp-evm-upgradeable/=lib/layerzero-oapp-evm-upgradeable/",
    "@layerzerolabs/oapp-evm/=lib/layerzero-oapp-evm/",
    "@layerzerolabs/lz-evm-protocol-v2/=lib/layerzero-protocol-v2/",

    # Hand-copied, not a submodule: smartcontractkit/ccip mixes BUSL-1.1 infrastructure
    # with the MIT-tagged application-facing files this binding actually needs. See
    # lib/ccip/contracts/src/v0.8/ccip/**/*.sol for per-file provenance
    # (contracts/evm/script/vendor/ccip.sh) and docs/provider-research.md §4.
    "@ccip/=lib/ccip/contracts/src/v0.8/ccip/",

    # Hand-copied, not a submodule: hyperlane-monorepo's MailboxClient/Router pin OZ 4.9.3,
    # which cannot share an inheritance graph with this repo's 5.4.0. Only dependency-free
    # interfaces and libraries are vendored (contracts/evm/script/vendor/hyperlane.sh).
    "@hyperlane/=lib/hyperlane/solidity/contracts/",

    # Hand-copied, not a submodule: the binding needs three import-free files (Core and
    # Executor interfaces), not the SDK's helpers. See contracts/evm/script/vendor/wormhole.sh.
    "@wormhole-sdk/=lib/wormhole-solidity-sdk/src/",

    # Hand-copied, not a submodule: one import-free interface from the optimism monorepo.
    # See contracts/evm/script/vendor/op-stack.sh.
    "@optimism/=lib/optimism/packages/contracts-bedrock/",
    # The interop interface imports its sibling by contracts-bedrock's own root-relative
    # path; scoped to lib/optimism/ so no other file sees an `interfaces/` remap.
    "lib/optimism/:interfaces/=lib/optimism/packages/contracts-bedrock/interfaces/",
]

# CI runs `forge fmt --check`. Forge's defaults, which most of the tree already followed.
# `lib/` is vendored upstream source, kept byte-identical to its recorded provenance.
[fmt]
ignore = ["lib/**"]

# CI runs `forge lint -D notes`, so any finding from a rule not excluded here fails it.
[lint]
ignore = ["lib/**"]
exclude_lints = [
    # Conventions this tree does not follow. Renaming public immutables or the OZ-style
    # `__X_init` initializers would change the ABI.
    "screaming-snake-case-immutable",
    "mixed-case-function",
    "mixed-case-variable",
    "multi-contract-file",
    "literal-instead-of-constant",
    "named-struct-fields",
    "internal-function-used-once",
    "missing-inheritance",
    "cyclomatic-complexity",
    "too-many-digits",
    # Each file states the lowest version it compiles under; `solc_version` pins the build.
    "pragma-inconsistent",
    # Suggestions whose fix changes bytecode.
    "asm-keccak256",
    "custom-errors",
    "event-fields",
    "inline-assembly",
    "low-level-calls",
    "unwrapped-modifier-logic",
    "non-reentrant-not-first",
    # Reviewed site by site in src/ and not enforced. `uint256 i;` is zero by definition,
    # which is all this rule found.
    "uninitialized-local",
    # A revert inside a loop is how an all-or-nothing check over an array is written.
    "require-revert-in-loop",
    # The three value transfers it found now emit first; every other hit follows no call,
    # or only a call into this protocol's own account proxy.
    "reentrancy-events",
    # Detector heuristics. They flag what tests and mocks do on purpose (an unread return, a
    # mock that refunds its caller), so they are enforced on src/ alone, by the profile below.
    "unsafe-typecast",
    "missing-zero-check",
    "calls-loop",
    "arbitrary-send-eth",
    "unused-return",
    "encode-packed-collision",
    "boolean-cst",
    "locked-ether",
    "empty-block",
]

# CI also runs `FOUNDRY_PROFILE=lint-src forge lint -D notes src`. A reviewed hit is suppressed
# inline with its reason. A profile replaces the list rather than extending it, so this
# repeats [lint] above, comments aside, minus the detector heuristics.
[profile.lint-src.lint]
exclude_lints = [
    "screaming-snake-case-immutable",
    "mixed-case-function",
    "mixed-case-variable",
    "multi-contract-file",
    "literal-instead-of-constant",
    "named-struct-fields",
    "internal-function-used-once",
    "missing-inheritance",
    "cyclomatic-complexity",
    "too-many-digits",
    "pragma-inconsistent",
    "asm-keccak256",
    "custom-errors",
    "event-fields",
    "inline-assembly",
    "low-level-calls",
    "unwrapped-modifier-logic",
    "non-reentrant-not-first",
    "uninitialized-local",
    "require-revert-in-loop",
    "reentrancy-events",
]
